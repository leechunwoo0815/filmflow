<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Riso still (program-driven)</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- 参数化静帧：still_spec.json v2 → scenes[].program（Scene DSL）→ 指定 t 的静帧。
     缺 program / 缺 schema → STILL_ERR E_PROGRAM_INVALID，不回退 meaning/operation。 -->
<canvas id="gl" width="1920" height="1080"></canvas>
<script src="../assets/riso-core.js"></script>
<script src="../assets/scene-kit.js"></script>
<script src="../assets/scene-render.js"></script>
<script>
const q = new URLSearchParams(location.search);
const EMBED = q.get('embed');
if (EMBED) {
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = EMBED;
  document.head.appendChild(l);
}
const SPEC_URL = q.get('spec');
const SCENE = q.get('scene') || '';
const T = parseFloat(q.get('t') || '0');
const gl = document.getElementById('gl');

function fail(message) {
  document.title = 'STILL_ERR ' + message;
  window.__STILL_DONE__ = true;
  const ctx = gl.getContext('2d');
  if (ctx) {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, gl.width, gl.height);
    ctx.fillStyle = '#f66'; ctx.font = '48px monospace';
    ctx.fillText('E_PROGRAM_INVALID', 80, 160);
    ctx.fillStyle = '#ddd'; ctx.font = '28px monospace';
    ctx.fillText(String(message).slice(0, 90), 80, 230);
  }
}

function collectText(program) {
  const out = [];
  const walk = (layers) => (layers || []).forEach((l) => {
    if (l.type === 'text') out.push(l.content || '');
    if (l.type === 'component') {
      const p = l.props || {};
      if (p.text) out.push(p.text);
      if (p.lines) out.push((p.lines || []).join(''));
      if (p.labels) out.push((p.labels || []).join(''));
      if (p.suffix) out.push(p.suffix);
    }
    if (l.type === 'group') walk(l.children);
  });
  walk(program.layers);
  return out.join('') || '风';
}

async function boot() {
  if (!SPEC_URL) return fail('missing spec');
  const spec = await (await fetch(SPEC_URL, { cache: 'no-store' })).json();
  if (spec.schema !== 'filmflow.still-spec/2') return fail('spec schema != filmflow.still-spec/2');
  const scene = (spec.scenes || []).find((s) => s.id === SCENE) || (spec.scenes || [])[0];
  if (!scene || !scene.program) return fail('scene has no program');
  const program = await (await fetch(scene.program, { cache: 'no-store' })).json();
  await SCENE_RENDER.preloadProgram(program);
  const c = program.canvas || {};
  const W = c.w || 1920, H = c.h || 1080;
  gl.width = W; gl.height = H;
  const localT = Math.max(0, Math.min(program.duration || 0, T - (scene.start || 0)));
  const text = collectText(program);
  if (document.fonts && document.fonts.load) {
    await Promise.all([
      document.fonts.load('900 120px "Noto Sans SC"', text),
      document.fonts.load('500 40px "Noto Sans SC"', text),
    ]);
    await document.fonts.ready;
  }
  const rendered = SCENE_RENDER.renderProgram(program, localT, { W, H });
  RISO.composite(rendered.plates, {
    canvas: gl, W, H,
    paper: c.paper, inks: c.inks, angles: c.angles, periods: c.periods,
    cam: { z: 1, tx: 0, ty: 0 },
  });
  window.__STILL_DONE__ = true;
  document.title = 'READY';
}

boot().catch((e) => fail(e && e.message ? e.message : String(e)));
</script>
</body>
</html>
