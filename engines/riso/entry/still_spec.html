<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Riso still (spec-driven)</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- 参数化静帧渲染：still_spec.json 驱动（D01 产物）。
     ?spec=<url> 读 spec；?scene=&t= 选场景时刻；?embed=<css url> 注入字体。 -->
<canvas id="gl" width="1920" height="1080"></canvas>
<script src="../assets/riso-core.js"></script>
<script>
const q = new URLSearchParams(location.search);
const EMBED = q.get('embed');
if (EMBED) {
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = EMBED;
  document.head.appendChild(l);
}
const SPEC_URL = q.get('spec');
const SCENE = q.get('scene') || '';
const T = parseFloat(q.get('t') || '0');
const W = 1920, H = 1080;
const FONT = '"Noto Sans SC", "PingFang SC", sans-serif';

function drawSpec(spec) {
  const tokens = (spec.tokens || {}).visual || {};
  const pal = tokens.palette || ['#F4EEE2', '#3D5588', '#FF665E', '#FFB511'];
  const screen = tokens.screen || {};
  const scenes = spec.scenes || [];
  const s = scenes.find((x) => x.id === SCENE) || scenes[0] || {};
  const camStr = String(s.camera || '');
  const zoomP = /推近\s*(\d+(?:\.\d+)?)%/.exec(camStr);
  const zoom = zoomP ? 1 + parseFloat(zoomP[1]) / 100 * RISO.seg(T, s.start || 0, s.end || 10) : 1;
  const cam = { z: zoom, tx: 960 * (1 - zoom), ty: 540 * (1 - zoom) };

  const blue = RISO.makePlate(W, H), orange = RISO.makePlate(W, H), yellow = RISO.makePlate(W, H);
  const b = blue.getContext('2d'), o = orange.getContext('2d'), y = yellow.getContext('2d');
  [b, o, y].forEach((c) => { c.setTransform(cam.z, 0, 0, cam.z, cam.tx, cam.ty); });

  // 背景版淡印
  RISO.ink(b, 0.06);
  b.fillRect(-100, -100, W + 200, H + 200);
  // 每镜文字块（meaning/operation 之外，编辑器的文字面板写在 spec.text_blocks）
  const blocks = (spec.text_blocks || {})[s.id] ||
    [{ text: s.meaning || '风', x: 214, y: 470, size: 96, weight: 900, plate: 'blue' },
     { text: s.operation || '', x: 214, y: 620, size: 44, weight: 500, plate: 'orange' }];
  const plates = { blue: b, orange: o, yellow: y };
  for (const blk of blocks) {
    const c = plates[blk.plate || 'blue'];
    const p = RISO.seg(T, s.start || 0, Math.min(s.end || 10, (s.start || 0) + 2));
    if (blk.size >= 72) {
      // 标题逐字落版
      RISO.ink(c, 1);
      c.save();
      c.font = `${blk.weight || 900} ${blk.size}px ${FONT}`;
      c.textBaseline = 'alphabetic';
      const chars = [...String(blk.text || '')];
      let cx = blk.x;
      chars.forEach((ch, i) => {
        const k = RISO.clamp((p * chars.length - i) / 1.3);
        if (k > 0) c.fillText(ch, cx, blk.y + (1 - RISO.easeOut(k)) * blk.size * 0.34);
        cx += c.measureText(ch).width;
      });
      c.restore();
    } else {
      const w = 1600;
      c.save();
      c.beginPath(); c.rect(blk.x - 12, blk.y - blk.size * 1.08, w, blk.size * 1.15 * RISO.clamp(p * 1.4));
      c.clip();
      RISO.text(c, String(blk.text || ''), blk.x, blk.y, blk.size, blk.weight || 500, 0.96, FONT);
      c.restore();
    }
  }
  const cross = (spec.tokens && spec.tokens.layout && spec.tokens.layout.registration_mark) || [1768, 128];
  RISO.drawCross(b, cross[0], cross[1], 1);
  RISO.drawCross(o, cross[0], cross[1], 1);
  // 套准偏移：默认蓝 +2px（tokens 可覆盖）
  const mis = (tokens.layout && tokens.layout.misregistration) || 0;
  return [{ canvas: blue, off: [mis, 0] }, { canvas: orange, off: [-mis, 0] }, { canvas: yellow, off: [0, 0] }];
}

function boot(spec) {
  try {
    RISO.composite(drawSpec(spec), { canvas: document.getElementById('gl'), W: W, H: H,
      paper: ((spec.tokens || {}).visual || {}).palette ? undefined : undefined,
      inks: undefined,
      cam: { z: 1, tx: 0, ty: 0 } });
    window.__STILL_DONE__ = true;
    document.title = 'READY';
  } catch (e) {
    document.title = 'STILL_ERR ' + e.message;
    window.__STILL_DONE__ = true;
  }
}

async function main() {
  let spec = {};
  if (SPEC_URL) {
    try { spec = await (await fetch(SPEC_URL)).json(); } catch (e) { spec = {}; }
  }
  const tryBoot = () => boot(spec);
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('900 120px ' + FONT, '风'),
      document.fonts.load('500 40px ' + FONT, '风'),
    ]).then(() => document.fonts.ready).then(tryBoot).catch(tryBoot);
    setTimeout(() => { if (!window.__STILL_DONE__) tryBoot(); }, 2500);
  } else {
    tryBoot();
  }
}
main();
</script>
</body>
</html>
