<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Riso film_spec</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<style id="ff-fonts"></style>
</head>
<body>
<!-- 参数化逐帧渲染：timeline_binding.programs[] + transitions[] 驱动。
     ?mode=render|proxy|preview&binding=&transitions=&start=&end=&total=&fps=&scale=&embed= -->
<canvas id="gl" width="1920" height="1080" style="display:none"></canvas>
<script src="../assets/riso-core.js"></script>
<script src="../assets/scene-kit.js"></script>
<script src="../assets/scene-render.js"></script>
<script>
const q = new URLSearchParams(location.search);
const TOK = new URLSearchParams(location.search).get('tok') || '';
const FFU = (p) => (TOK ? p + (p.includes('?') ? '&' : '?') + 'tok=' + encodeURIComponent(TOK) : p);

const EMBED = q.get('embed');
if (EMBED) {
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = EMBED;
  document.head.appendChild(l);
}
const MODE = q.get('mode') || 'render';
const BINDING = q.get('binding') || '';
const TRANSITIONS = q.get('transitions') || '';
const START = parseInt(q.get('start') || '0', 10);
const END = parseInt(q.get('end') || '0', 10);
const TOTAL = parseInt(q.get('total') || '0', 10);
const SCALE = parseFloat(q.get('scale') || '1');
const OUT_W = parseInt(q.get('outW') || '0', 10);
const OUT_H = parseInt(q.get('outH') || '0', 10);
const PROXY_FPS = parseFloat(q.get('proxy_fps') || '0');

function title(s) { document.title = s; }
function fail(e) {
  title('FILM_ERR ' + (e && e.message ? e.message : e));
  // 让 F02 立即结束等待，再由缺帧检查报错（不要挂 1800s）；预览绝不写 DONE
  if (MODE !== 'preview') fetch(FFU('/done'), { method: 'POST' }).catch(() => {});
}

function allText(programs) {
  const out = [];
  const walk = (layers) => (layers || []).forEach((l) => {
    if (l.type === 'text') out.push(l.content || '');
    if (l.type === 'component') {
      const p = l.props || {};
      if (p.text) out.push(p.text);
      if (p.lines) out.push((p.lines || []).join(''));
      if (p.labels) out.push((p.labels || []).join(''));
      if (p.suffix) out.push(p.suffix);
    }
    if (l.type === 'group') walk(l.children);
  });
  programs.forEach((p) => walk(p.program.layers));
  return out.join('') || '风';
}

async function loadJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch ' + url + ' ' + r.status);
  return await r.json();
}

// ---- 预览 API（PreviewService 通过 CDP 在临时 page 中调用；不写 DONE / 不落 final） ----
function injectFonts(css) {
  const el = document.getElementById('ff-fonts');
  if (el && css) el.textContent = css;
}

async function loadPreviewFonts(programs) {
  if (!document.fonts || !document.fonts.load) return;
  const text = allText(programs);
  await Promise.all([
    document.fonts.load('900 120px "Noto Sans SC"', text),
    document.fonts.load('500 40px "Noto Sans SC"', text),
  ]);
  await document.fonts.ready;
}

window.__FF_PREVIEW_INIT__ = async function (payload) {
  injectFonts(payload.fontCss || '');
  const programs = (payload.programs || []).map((p) => ({
    id: p.id, start: p.start, end: p.end, program: p.program,
  }));
  if (!programs.length) throw new Error('E_PROGRAM_INVALID: preview.programs 为空');
  await loadPreviewFonts(programs);
  await SCENE_RENDER.preloadPrograms(programs);
  const pc = programs[0].program.canvas || {};
  const srcW = pc.w || 1920;
  const W = payload.width || srcW;
  const H = payload.height || pc.h || 1080;
  window.__FF_PREVIEW_STATE__ = {
    programs, transitions: payload.transitions || [],
    W, H, scale: payload.scale || (W / srcW),
  };
  return { W, H, scenes: programs.length };
};

window.__FF_PREVIEW_FRAME__ = function (t) {
  const st = window.__FF_PREVIEW_STATE__;
  if (!st) throw new Error('E_PREVIEW_NOT_INIT');
  const canvas = SCENE_RENDER.renderFrameAt(st.programs, st.transitions, t,
    { W: st.W, H: st.H, scale: st.scale });
  return canvas.toDataURL('image/png');
};

window.__FF_PREVIEW_FRAME_JPEG__ = function (t, quality) {
  const st = window.__FF_PREVIEW_STATE__;
  if (!st) throw new Error('E_PREVIEW_NOT_INIT');
  const canvas = SCENE_RENDER.renderFrameAt(st.programs, st.transitions, t,
    { W: st.W, H: st.H, scale: st.scale });
  return canvas.toDataURL('image/jpeg', quality || 0.98);
};

window.__FF_PREVIEW__ = async function (payload) {
  window.__PREVIEW_DONE__ = false;
  window.__PREVIEW_PNG__ = null;
  await window.__FF_PREVIEW_INIT__(payload);
  window.__PREVIEW_PNG__ = window.__FF_PREVIEW_FRAME__(payload.t || 0);
  window.__PREVIEW_DONE__ = true;
  title('PREVIEW_READY');
  return true;
};

window.__FF_READY__ = true;

async function boot() {
  title('LOADING');
  const binding = await loadJSON(BINDING);
  const transitions = TRANSITIONS ? await loadJSON(TRANSITIONS).catch(() => ({ transitions: [] })) : { transitions: [] };
  const programs = [];
  for (const p of (binding.programs || [])) {
    const prog = p.program_inline || await loadJSON(p.program);
    programs.push({ id: p.id, start: p.start, end: p.end, program: prog });
  }
  if (!programs.length) throw new Error('E_PROGRAM_INVALID: binding.programs 为空');
  await SCENE_RENDER.preloadPrograms(programs);
  const W = programs[0].program.canvas.w || 1920;
  const H = programs[0].program.canvas.h || 1080;
  const FPS = programs[0].program.canvas.fps || 24;
  const text = allText(programs);
  if (document.fonts && document.fonts.load) {
    await Promise.all([
      document.fonts.load('900 120px "Noto Sans SC"', text),
      document.fonts.load('500 40px "Noto Sans SC"', text),
    ]);
    await document.fonts.ready;
  }
  const trs = transitions.transitions || transitions || [];
  if (MODE === 'preview') {
    const t = parseFloat(q.get('t') || '0');
    const canvas = SCENE_RENDER.renderFrameAt(programs, trs, t, { W, H });
    window.__PREVIEW_PNG__ = canvas.toDataURL('image/png');
    window.__PREVIEW_DONE__ = true;
    title('PREVIEW_READY');
    return;
  }
  if (MODE === 'proxy') {
    const out = document.createElement('canvas');
    out.width = OUT_W || Math.round(W * (SCALE || 0.25));
    out.height = OUT_H || Math.round(H * (SCALE || 0.25));
    const ctx = out.getContext('2d');
    const pfps = PROXY_FPS || 12;
    const total = TOTAL || Math.round((programs[programs.length - 1].end) * pfps);
    for (let i = 0; i < total; i++) {
      const t = i / pfps;
      const canvas = SCENE_RENDER.renderFrameAt(programs, trs, t, { W, H });
      ctx.clearRect(0, 0, out.width, out.height);
      ctx.drawImage(canvas, 0, 0, out.width, out.height);
      const data = out.toDataURL('image/png');
      const r = await fetch(FFU('/pframe?i=' + i), { method: 'POST', body: data });
      if (!r.ok) throw new Error('pframe ' + i + ' ' + r.status);
      if (i % Math.max(1, Math.round(pfps)) === 0) title('PROXY ' + i + '/' + total);
    }
    await fetch(FFU('/done'), { method: 'POST' });
    title('PROXY_DONE');
    return;
  }
  const total = TOTAL || Math.round((programs[programs.length - 1].end) * FPS);
  const end = Math.min(END || total, total);
  for (let i = START; i < end; i++) {
    const canvas = SCENE_RENDER.renderFrameAt(programs, trs, i / FPS, { W, H });
    const data = canvas.toDataURL('image/png');
    const r = await fetch(FFU('/frame?i=' + i), { method: 'POST', body: data });
    if (!r.ok) throw new Error('frame ' + i + ' ' + r.status);
    if (i % 12 === 0) title('FRAME ' + i + '/' + total);
  }
  // 每次调用都发 DONE：F02 以 DONE 作为本段渲染结束信号（短片不再等 1800s）
  await fetch(FFU('/done'), { method: 'POST' });
  title('DONE');
}

const PAYLOAD = q.get('payload');
if (MODE === 'preview' && PAYLOAD) {
  try {
    const bin = Uint8Array.from(atob(PAYLOAD), (c) => c.charCodeAt(0));
    const obj = JSON.parse(new TextDecoder().decode(bin));
    window.__FF_PREVIEW__(obj).catch(fail);
  } catch (e) { fail(e); }
} else if (MODE === 'preview' && !BINDING) {
  // 等待 PreviewService 通过 CDP evaluate 注入 payload
  title('PREVIEW_WAITING');
} else {
  boot().catch(fail);
}
</script>
</body>
</html>
