# FilmFlow CI（P1-20，2026-11-05 首版）
#
# 范围（刻意收窄，避免"绿得没有意义"）：
# - unit + BDD 全量（无 Chrome/ffmpeg/风格库依赖；渲染级集成测试**仍只在有真实
#   环境的本机跑**——隔离服务要系统 Chrome + ffmpeg + 风格库，Ubuntu runner 装
#   这些不难，但 golden/SSIM 的语义锚在本机字体/风格库上，跑在别处会给出另一套
#   数字，反而破坏"任何完成申报必须附可复现实测输出"的口径。要上渲染级 CI 需
#   先把字体/风格库指纹参数化，那是独立一批。）
# - ruff（server 配置口径；scripts/ 也按同一配置过一遍）
# - tsc --noEmit（web）
# - 文档守卫 / verify_p1_governance 依赖生产库与运行中的服务，属本机验收，不进 CI。
name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: lint 棘轮（三口径，与治理第 17 项同源）
        # 原 `ruff check server scripts` 裸跑在存量上必然红（B8 实测 387）；
        # 棘轮=对照 lint-baseline.json 只许降不许涨，首跑即绿且有守卫意义
        run: uv run --project server python scripts/lint_ratchet.py
      - name: pnpm install
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: web 类型检查
        run: cd web && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit

  test-unit-bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: pytest unit + bdd（隔离 HOME，不碰任何生产库）
        run: cd server && uv run pytest tests/unit tests/bdd -q
